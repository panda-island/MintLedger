name: Read TestFlight crash summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read latest MintLedger crash summaries
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/crash-venv"
          "$RUNNER_TEMP/crash-venv/bin/pip" install --quiet PyJWT cryptography
          APP_STORE_CONNECT_KEY_PATH="$KEY_PATH" \
            "$RUNNER_TEMP/crash-venv/bin/python" ci/fetch_testflight_crash_summary.py
