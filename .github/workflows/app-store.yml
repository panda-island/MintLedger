name: Upload to App Store Connect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profiles
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          APP_PROFILE_RAW="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE_RAW="$RUNNER_TEMP/widget.mobileprovision"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_RAW"
          printf '%s' "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_RAW"

          security cms -D -i "$APP_PROFILE_RAW" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$WIDGET_PROFILE_RAW" > "$RUNNER_TEMP/widget-profile.plist"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget-profile.plist")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/app-profile.plist")
          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")

          cp "$APP_PROFILE_RAW" "$PROFILE_DIR/$APP_PROFILE_UUID.mobileprovision"
          cp "$WIDGET_PROFILE_RAW" "$PROFILE_DIR/$WIDGET_PROFILE_UUID.mobileprovision"

          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed app profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"
          echo "Installed widget profile: $WIDGET_PROFILE_NAME ($WIDGET_PROFILE_UUID)"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Generate Xcode project for App Store signing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()
          app_profile = json.dumps(os.environ["APP_PROFILE_NAME"])
          widget_profile = json.dumps(os.environ["WIDGET_PROFILE_NAME"])

          app_marker = "        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger\n"
          widget_marker = "        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger.widget\n"

          if app_marker not in text or widget_marker not in text:
              raise SystemExit("Could not find MintLedger bundle identifiers in project.yml")

          text = text.replace(
              app_marker,
              app_marker
              + "        CODE_SIGN_STYLE: Manual\n"
              + "        CODE_SIGN_IDENTITY: Apple Distribution\n"
              + f"        PROVISIONING_PROFILE_SPECIFIER: {app_profile}\n",
              1,
          )
          text = text.replace(
              widget_marker,
              widget_marker
              + "        CODE_SIGN_STYLE: Manual\n"
              + "        CODE_SIGN_IDENTITY: Apple Distribution\n"
              + f"        PROVISIONING_PROFILE_SPECIFIER: {widget_profile}\n",
              1,
          )
          path.write_text(text)
          PY
          xcodegen generate

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          xcodebuild archive \
            -project MintLedger.xcodeproj \
            -scheme MintLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MintLedger.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pandaisland.mintledger</key>
              <string>$APP_PROFILE_NAME</string>
              <key>com.pandaisland.mintledger.widget</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MintLedger.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/AppStoreExport" -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintLedger-AppStore-IPA
          path: ${{ runner.temp }}/AppStoreExport/*.ipa
          if-no-files-found: error
          retention-days: 14
