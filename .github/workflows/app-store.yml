name: Upload to App Store Connect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Create App Store provisioning profiles
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          LOCAL_CERTIFICATE_PATH="$RUNNER_TEMP/distribution-certificate.pem"
          openssl pkcs12 \
            -in "$RUNNER_TEMP/distribution.p12" \
            -clcerts \
            -nokeys \
            -passin env:P12_PASSWORD \
            -out "$LOCAL_CERTIFICATE_PATH"
          python3 -m pip install --quiet PyJWT cryptography
          APP_STORE_CONNECT_KEY_PATH="$API_KEY_PATH" \
          LOCAL_DISTRIBUTION_CERTIFICATE_PATH="$LOCAL_CERTIFICATE_PATH" \
            python3 ci/create_app_store_profiles.py

      - name: Generate Xcode project
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()
          profiles = {
              "com.pandaisland.mintledger": os.environ["APP_PROFILE_NAME"],
              "com.pandaisland.mintledger.widget": os.environ["WIDGET_PROFILE_NAME"],
              "com.pandaisland.mintledger.watchkitapp": os.environ["WATCH_PROFILE_NAME"],
          }
          for bundle_id, profile_name in profiles.items():
              marker = f"        PRODUCT_BUNDLE_IDENTIFIER: {bundle_id}\n"
              if marker not in text:
                  raise SystemExit(f"Could not find {bundle_id} in project.yml")
              signing = (
                  marker
                  + "        CODE_SIGN_STYLE: Manual\n"
                  + "        CODE_SIGN_IDENTITY: Apple Distribution\n"
                  + f"        PROVISIONING_PROFILE_SPECIFIER: {json.dumps(profile_name)}\n"
              )
              text = text.replace(marker, signing, 1)
          path.write_text(text)
          PY
          xcodegen generate

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          xcodebuild archive \
            -project MintLedger.xcodeproj \
            -scheme MintLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MintLedger.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pandaisland.mintledger</key>
              <string>$APP_PROFILE_NAME</string>
              <key>com.pandaisland.mintledger.widget</key>
              <string>$WIDGET_PROFILE_NAME</string>
              <key>com.pandaisland.mintledger.watchkitapp</key>
              <string>$WATCH_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MintLedger.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/AppStoreExport" -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintLedger-AppStore-IPA
          path: ${{ runner.temp }}/AppStoreExport/*.ipa
          if-no-files-found: error
          retention-days: 14
