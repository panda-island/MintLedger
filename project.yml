name: MintLedger
options:
  bundleIdPrefix: com.pandaisland
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 23
    MARKETING_VERSION: 1.7.3
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  MintLedger:
    type: application
    platform: iOS
    sources:
      - path: MintLedger
        excludes:
          - Resources
      - path: MintLedger/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger
        INFOPLIST_FILE: MintLedger/Info.plist
        CODE_SIGN_ENTITLEMENTS: MintLedger/MintLedger.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MintLedgerWidget
        embed: true
      - target: MintLedgerWatch
        embed: true
        platformFilter: iOS
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
  MintLedgerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MintLedgerWidget
      - path: MintLedger/Core/Models.swift
      - path: MintLedger/Core/SharedLedgerStorage.swift
      - path: MintLedger/Intents/QuickExpenseIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger.widget
        INFOPLIST_FILE: MintLedgerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MintLedgerWidget/MintLedgerWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  MintLedgerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MintLedgerWatch
      - path: MintLedger/Core/Models.swift
      - path: MintLedger/Core/WatchSyncProtocol.swift
      - path: MintLedger/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger.watchkitapp
        PRODUCT_NAME: MintLedgerWatch
        INFOPLIST_FILE: MintLedgerWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme: {}
  MintLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MintLedgerTests
    dependencies:
      - target: MintLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.mintledger.tests
schemes:
  MintLedger:
    build:
      targets:
        MintLedger: all
        MintLedgerWidget: all
        MintLedgerTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MintLedgerTests
