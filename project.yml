name: MintLedger
options:
  bundleIdPrefix: com.a0973
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.1.4
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages: {}
targets:
  MintLedger:
    type: application
    platform: iOS
    sources:
      - path: MintLedger
        excludes:
          - Resources
      - path: MintLedger/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a0973.MintLedger
        INFOPLIST_FILE: MintLedger/Info.plist
        CODE_SIGN_ENTITLEMENTS: MintLedger/MintLedger.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MintLedgerWidget
        embed: true
  MintLedgerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MintLedgerWidget
      - path: MintLedger/Core/Models.swift
      - path: MintLedger/Core/SharedLedgerStorage.swift
      - path: MintLedger/Intents/QuickExpenseIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a0973.MintLedger.Widget
        INFOPLIST_FILE: MintLedgerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MintLedgerWidget/MintLedgerWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  MintLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MintLedgerTests
    dependencies:
      - target: MintLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a0973.MintLedgerTests
schemes:
  MintLedger:
    build:
      targets:
        MintLedger: all
        MintLedgerWidget: all
        MintLedgerTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MintLedgerTests
